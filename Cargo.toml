[package]
name = "solfege_soundfonteditor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18"
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
hound = "3.5.1"
rfd = "0.17"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
